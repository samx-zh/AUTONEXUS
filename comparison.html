<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNexus — Compare Vehicles</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .compare-layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }

    .selector-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.5rem;
      align-items: end;
      margin-bottom: 2rem;
    }

    .selector-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .selector-box.selected {
      border-color: rgba(232,180,0,0.5);
    }

    .selector-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .selector-box:first-child::before {
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .selector-box:last-child::before {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .selector-box h3 {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.3rem;
      padding-bottom: 1.2rem;
    }

    .vs-text {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent2);
      line-height: 1;
    }

    .vs-line {
      width: 2px;
      height: 30px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 1px;
    }

    .car-preview {
      margin-top: 1rem;
      display: none;
    }

    .car-preview.show { display: block; }

    .preview-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.6rem;
    }

    .preview-name {
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      color: var(--text);
      letter-spacing: 1px;
    }

    .preview-brand {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .compare-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    /* Comparison Table */
    .compare-table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
      display: none;
    }

    .compare-table-wrap.show { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .table-header {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }

    .table-header .header-label {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      align-self: end;
    }

    .car-header {
      text-align: center;
    }

    .car-header img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.6rem;
    }

    .car-header .h-name {
      font-family: 'Orbitron', monospace;
      font-size: 0.82rem;
      color: var(--text);
      letter-spacing: 1px;
    }

    .car-header .h-price {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 700;
      margin-top: 0.2rem;
    }

    .compare-row {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      padding: 0.9rem 1.5rem;
      gap: 1rem;
      border-bottom: 1px solid rgba(30,45,61,0.5);
      transition: background 0.2s;
    }

    .compare-row:hover { background: rgba(255,255,255,0.02); }
    .compare-row:last-child { border-bottom: none; }

    .row-label {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .row-value {
      text-align: center;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
    }

    .row-value.winner {
      color: var(--success);
      font-weight: 700;
    }

    .row-value.loser {
      color: var(--text-muted);
    }

    .winner-badge {
      display: inline-block;
      background: rgba(0,214,143,0.12);
      border: 1px solid rgba(0,214,143,0.3);
      color: var(--success);
      font-size: 0.6rem;
      letter-spacing: 1px;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-left: 0.4rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .section-divider {
      background: rgba(232,180,0,0.05);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.5rem;
    }

    .section-divider span {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .features-compare {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      justify-content: center;
    }

    .feat-tag {
      padding: 0.2rem 0.5rem;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .feat-tag.has { background: rgba(0,214,143,0.1); color: var(--success); border: 1px solid rgba(0,214,143,0.2); }
    .feat-tag.no { background: rgba(255,61,113,0.08); color: var(--text-muted); border: 1px solid var(--border); text-decoration: line-through; }

    .form-error-banner {
      display: none;
      background: rgba(255,61,113,0.1);
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--error);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .form-error-banner.show { display: block; }

    @media (max-width: 700px) {
      .selector-row { grid-template-columns: 1fr; }
      .vs-divider { flex-direction: row; }
      .vs-line { width: 40px; height: 2px; }
      .table-header,
      .compare-row { grid-template-columns: 100px 1fr 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <span class="icon">🚗</span> AUTONEXUS
    </a>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <div class="page-header">
      <h1>Compare Vehicles</h1>
      <p class="subtitle">Put any two vehicles head-to-head</p>
    </div>

    <a href="home.html" class="home-link">← Back to Home</a>

    <div class="compare-layout">
      <div class="form-error-banner" id="errorBanner">
        ⚠️ Please select two different vehicles before comparing.
      </div>

      <form id="compareForm" novalidate>
        <div class="selector-row">
          <!-- Car 1 -->
          <div class="selector-box" id="box1">
            <h3>🚗 Vehicle One</h3>
            <div class="form-group" id="fg-car1">
              <label for="car1">Select Vehicle *</label>
              <select id="car1">
                <option value="">— Choose a vehicle —</option>
              </select>
              <span class="error-msg">Please select Vehicle One.</span>
            </div>
            <div class="car-preview" id="preview1">
              <img src="" alt="" class="preview-img" id="pimg1">
              <div class="preview-name" id="pname1"></div>
              <div class="preview-brand" id="pbrand1"></div>
            </div>
          </div>

          <!-- VS -->
          <div class="vs-divider">
            <div class="vs-line"></div>
            <div class="vs-text">VS</div>
            <div class="vs-line"></div>
          </div>

          <!-- Car 2 -->
          <div class="selector-box" id="box2">
            <h3>🏎️ Vehicle Two</h3>
            <div class="form-group" id="fg-car2">
              <label for="car2">Select Vehicle *</label>
              <select id="car2">
                <option value="">— Choose a vehicle —</option>
              </select>
              <span class="error-msg">Please select Vehicle Two.</span>
            </div>
            <div class="car-preview" id="preview2">
              <img src="" alt="" class="preview-img" id="pimg2">
              <div class="preview-name" id="pname2"></div>
              <div class="preview-brand" id="pbrand2"></div>
            </div>
          </div>
        </div>

        <div class="compare-actions">
          <button type="submit" class="btn btn-primary">⚡ COMPARE NOW</button>
          <button type="button" class="btn btn-outline" id="resetCompare">↺ RESET</button>
        </div>
      </form>

      <!-- Comparison Table -->
      <div class="compare-table-wrap" id="compareTable"></div>
    </div>
  </div>

  <script src="cars.js"></script>
  <script>
    if (sessionStorage.getItem('autonexus_auth') !== 'true') {
      window.location.href = 'index.html';
    }

    // Populate selects
    const car1Sel = document.getElementById('car1');
    const car2Sel = document.getElementById('car2');

    carsData.forEach(car => {
      const opt1 = new Option(`${car.brand} ${car.name}`, car.id);
      const opt2 = new Option(`${car.brand} ${car.name}`, car.id);
      car1Sel.add(opt1);
      car2Sel.add(opt2);
    });

    function updatePreview(selEl, previewEl, imgEl, nameEl, brandEl) {
      const id = parseInt(selEl.value);
      const car = carsData.find(c => c.id === id);
      if (car) {
        imgEl.src = car.image;
        nameEl.textContent = car.name;
        brandEl.textContent = car.brand;
        previewEl.classList.add('show');
      } else {
        previewEl.classList.remove('show');
      }
    }

    car1Sel.addEventListener('change', () =>
      updatePreview(car1Sel, document.getElementById('preview1'),
        document.getElementById('pimg1'), document.getElementById('pname1'), document.getElementById('pbrand1'))
    );

    car2Sel.addEventListener('change', () =>
      updatePreview(car2Sel, document.getElementById('preview2'),
        document.getElementById('pimg2'), document.getElementById('pname2'), document.getElementById('pbrand2'))
    );

    document.getElementById('resetCompare').addEventListener('click', () => {
      document.getElementById('compareForm').reset();
      ['preview1', 'preview2'].forEach(id => document.getElementById(id).classList.remove('show'));
      ['fg-car1', 'fg-car2'].forEach(id => document.getElementById(id).classList.remove('has-error'));
      document.getElementById('compareTable').classList.remove('show');
      document.getElementById('compareTable').innerHTML = '';
      document.getElementById('errorBanner').classList.remove('show');
    });

    document.getElementById('compareForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id1 = parseInt(car1Sel.value);
      const id2 = parseInt(car2Sel.value);
      const errBanner = document.getElementById('errorBanner');
      let valid = true;

      document.getElementById('fg-car1').classList.toggle('has-error', !id1);
      document.getElementById('fg-car2').classList.toggle('has-error', !id2);

      if (!id1 || !id2) { valid = false; }
      if (id1 && id2 && id1 === id2) {
        errBanner.textContent = '⚠️ Please select two different vehicles to compare.';
        errBanner.classList.add('show');
        return;
      }

      errBanner.classList.remove('show');

      if (!valid) return;

      const c1 = carsData.find(c => c.id === id1);
      const c2 = carsData.find(c => c.id === id2);
      renderComparison(c1, c2);
    });

    function formatPrice(p) {
      if (p >= 100000) return '₹' + (p / 100000).toFixed(1) + 'L';
      return '₹' + p.toLocaleString('en-IN');
    }

    function winnerClass(v1, v2, higher = true) {
      if (v1 === v2) return ['', ''];
      const w = higher ? (v1 > v2 ? 0 : 1) : (v1 < v2 ? 0 : 1);
      return w === 0 ? ['winner', 'loser'] : ['loser', 'winner'];
    }

    function numFromStr(s) {
      return parseFloat(s.replace(/[^0-9.]/g, '')) || 0;
    }

    function renderComparison(c1, c2) {
      const table = document.getElementById('compareTable');
      table.classList.add('show');

      const pClasses = winnerClass(c1.price, c2.price, false); // lower price wins
      const powerClasses = winnerClass(numFromStr(c1.power), numFromStr(c2.power));
      const torqueClasses = winnerClass(numFromStr(c1.torque), numFromStr(c2.torque));
      const mileageClasses = winnerClass(numFromStr(c1.mileage), numFromStr(c2.mileage));
      const seatClasses = winnerClass(c1.seating, c2.seating);

      function cell(val, cls) {
        const wb = cls === 'winner' ? '<span class="winner-badge">BETTER</span>' : '';
        return `<div class="row-value ${cls}">${val}${wb}</div>`;
      }

      // All features union
      const allFeatures = [...new Set([...c1.features, ...c2.features])];

      table.innerHTML = `
        <div class="table-header">
          <div class="header-label">Specification</div>
          <div class="car-header">
            <img src="${c1.image}" alt="${c1.name}" onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400'">
            <div class="h-name">${c1.name}</div>
            <div class="h-price">${formatPrice(c1.price)}</div>
          </div>
          <div class="car-header">
            <img src="${c2.image}" alt="${c2.name}" onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400'">
            <div class="h-name">${c2.name}</div>
            <div class="h-price">${formatPrice(c2.price)}</div>
          </div>
        </div>

        <div class="section-divider"><span>💰 Pricing</span></div>
        <div class="compare-row">
          <div class="row-label">📦 Price</div>
          ${cell(formatPrice(c1.price), pClasses[0])}
          ${cell(formatPrice(c2.price), pClasses[1])}
        </div>

        <div class="section-divider"><span>⚙️ Performance</span></div>
        <div class="compare-row">
          <div class="row-label">🔧 Engine</div>
          <div class="row-value">${c1.engine}</div>
          <div class="row-value">${c2.engine}</div>
        </div>
        <div class="compare-row">
          <div class="row-label">⚡ Power</div>
          ${cell(c1.power, powerClasses[0])}
          ${cell(c2.power, powerClasses[1])}
        </div>
        <div class="compare-row">
          <div class="row-label">🔄 Torque</div>
          ${cell(c1.torque, torqueClasses[0])}
          ${cell(c2.torque, torqueClasses[1])}
        </div>
        <div class="compare-row">
          <div class="row-label">⛽ Fuel Type</div>
          <div class="row-value">${c1.fuelType}</div>
          <div class="row-value">${c2.fuelType}</div>
        </div>
        <div class="compare-row">
          <div class="row-label">🛣️ Mileage</div>
          ${cell(c1.mileage, mileageClasses[0])}
          ${cell(c2.mileage, mileageClasses[1])}
        </div>

        <div class="section-divider"><span>🚗 Specs</span></div>
        <div class="compare-row">
          <div class="row-label">🔁 Transmission</div>
          <div class="row-value">${c1.transmission}</div>
          <div class="row-value">${c2.transmission}</div>
        </div>
        <div class="compare-row">
          <div class="row-label">🪑 Seating</div>
          ${cell(c1.seating + ' Seats', seatClasses[0])}
          ${cell(c2.seating + ' Seats', seatClasses[1])}
        </div>
        <div class="compare-row">
          <div class="row-label">🛡️ Safety</div>
          <div class="row-value">${c1.safety}</div>
          <div class="row-value">${c2.safety}</div>
        </div>
        <div class="compare-row">
          <div class="row-label">🚙 Body Type</div>
          <div class="row-value">${c1.bodyType}</div>
          <div class="row-value">${c2.bodyType}</div>
        </div>

        <div class="section-divider"><span>✨ Features</span></div>
        <div class="compare-row">
          <div class="row-label">🎯 Key Features</div>
          <div class="row-value">
            <div class="features-compare">
              ${allFeatures.map(f => `<span class="feat-tag ${c1.features.includes(f) ? 'has' : 'no'}">${f}</span>`).join('')}
            </div>
          </div>
          <div class="row-value">
            <div class="features-compare">
              ${allFeatures.map(f => `<span class="feat-tag ${c2.features.includes(f) ? 'has' : 'no'}">${f}</span>`).join('')}
            </div>
          </div>
        </div>
      `;

      table.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>
</html>
