<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNexus — Find Your Car</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .fyc-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }

    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .filter-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .filter-card h2 {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
      align-items: end;
    }

    .price-range-wrap {
      display: flex;
      flex-direction: column;
    }

    .price-display {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: var(--accent);
      text-align: right;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .filter-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      align-items: center;
    }

    .result-count {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'Exo 2', sans-serif;
    }

    .result-count span {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Results grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .car-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: fadeUp 0.5s ease both;
      cursor: pointer;
    }

    .car-card:hover {
      border-color: var(--accent);
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .car-img-wrap {
      position: relative;
      height: 160px;
      overflow: hidden;
    }

    .car-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .car-card:hover .car-img {
      transform: scale(1.05);
    }

    .car-price-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(10,14,26,0.9);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-family: 'Orbitron', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 700;
    }

    .car-type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(10,14,26,0.85);
      border: 1px solid rgba(255,77,0,0.5);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent2);
      font-weight: 700;
    }

    .car-info {
      padding: 1rem;
    }

    .car-brand {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .car-name {
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    .car-specs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .spec-tag {
      padding: 0.2rem 0.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .car-card .btn {
      width: 100%;
      padding: 0.6rem;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    /* Detail modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      z-index: 1;
      transition: background 0.3s;
    }

    .modal-close:hover { background: var(--error); }

    .modal-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 14px 14px 0 0;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    .modal-brand {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .modal-desc {
      color: var(--text-muted);
      font-family: 'Exo 2', sans-serif;
      line-height: 1.7;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .spec-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      text-align: center;
    }

    .spec-box .s-label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .spec-box .s-value {
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 700;
    }

    .features-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .feature-tag {
      padding: 0.3rem 0.8rem;
      background: rgba(232,180,0,0.08);
      border: 1px solid rgba(232,180,0,0.25);
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-state h3 {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 700px) {
      .filter-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <span class="icon">🚗</span> AUTONEXUS
    </a>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <div class="page-header">
      <h1>Find Your Car</h1>
      <p class="subtitle">Filter by purpose, body type and budget</p>
    </div>

    <a href="home.html" class="home-link">← Back to Home</a>

    <div class="fyc-layout">
      <div class="filter-card">
        <h2>🔍 Smart Filters</h2>
        <form id="filterForm" novalidate>
          <div class="filter-grid">
            <div class="form-group" id="fg-use">
              <label for="f-use">Car Purpose *</label>
              <select id="f-use">
                <option value="">— Select Purpose —</option>
                <option value="family">🏠 Family</option>
                <option value="offroad">🏔️ Off-Road</option>
                <option value="work">🔧 Work / Commercial</option>
                <option value="towing">🚛 Towing</option>
                <option value="tech">💻 Tech / EV</option>
                <option value="city">🌆 City Commuter</option>
              </select>
              <span class="error-msg">Please select a purpose.</span>
            </div>

            <div class="form-group" id="fg-body">
              <label for="f-body">Body Type *</label>
              <select id="f-body">
                <option value="">— Select Body Type —</option>
                <option value="suv">🚙 SUV</option>
                <option value="sedan">🚗 Sedan</option>
                <option value="hatchback">🚕 Hatchback</option>
                <option value="pickup">🛻 Pickup Truck</option>
                <option value="mpv">🚐 MPV / Van</option>
                <option value="mini-truck">🚚 Mini Truck</option>
              </select>
              <span class="error-msg">Please select a body type.</span>
            </div>

            <div class="form-group price-range-wrap">
              <label for="f-price">Max Budget</label>
              <div class="price-display" id="priceDisplay">₹60,00,000</div>
              <input type="range" id="f-price" class="range-slider"
                min="500000" max="6000000" step="100000" value="6000000">
            </div>
          </div>

          <div class="filter-actions">
            <button type="submit" class="btn btn-primary">⚡ SEARCH CARS</button>
            <button type="button" class="btn btn-outline" id="resetBtn">↺ RESET</button>
            <div class="result-count" id="resultCount" style="display:none;">
              Found <span id="resultNum">0</span> vehicles
            </div>
          </div>
        </form>
      </div>

      <div class="results-grid" id="resultsGrid"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <img src="" alt="" class="modal-img" id="modalImg">
      <div class="modal-body">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-brand" id="modalBrand"></div>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="specs-grid" id="specsGrid"></div>
        <div style="margin-bottom:0.8rem;">
          <div style="font-size:0.7rem; letter-spacing:2px; color:var(--text-muted); margin-bottom:0.6rem; text-transform:uppercase;">Key Features</div>
          <div class="features-list" id="featuresList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="car.js"></script>
  <script>
    if (sessionStorage.getItem('autonexus_auth') !== 'true') {
      window.location.href = 'index.html';
    }

    const priceSlider = document.getElementById('f-price');
    const priceDisplay = document.getElementById('priceDisplay');
    const resultsGrid = document.getElementById('resultsGrid');
    const toast = document.getElementById('toast');

    priceSlider.addEventListener('input', function() {
      priceDisplay.textContent = '₹' + Number(this.value).toLocaleString('en-IN');
    });

    function showToast(msg, type = 'error') {
      toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
      toast.className = `toast ${type}`;
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function formatPrice(p) {
      if (p >= 100000) return '₹' + (p / 100000).toFixed(1) + 'L';
      return '₹' + p.toLocaleString('en-IN');
    }

    document.getElementById('filterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;

      const use = document.getElementById('f-use').value;
      const body = document.getElementById('f-body').value;
      const maxPrice = parseInt(priceSlider.value);

      const fgUse = document.getElementById('fg-use');
      const fgBody = document.getElementById('fg-body');

      fgUse.classList.toggle('has-error', !use);
      fgBody.classList.toggle('has-error', !body);

      if (!use || !body) {
        showToast('Please select both Purpose and Body Type.', 'error');
        return;
      }

      // Filter
      const filtered = carsData.filter(car => {
        const useMatch = car.use.includes(use);
        const bodyMatch = car.bodyType === body;
        const priceMatch = car.price <= maxPrice;
        return (useMatch || bodyMatch) && priceMatch;
      });

      renderResults(filtered);
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      document.getElementById('filterForm').reset();
      priceDisplay.textContent = '₹60,00,000';
      resultsGrid.innerHTML = '';
      document.getElementById('resultCount').style.display = 'none';
      ['fg-use', 'fg-body'].forEach(id => document.getElementById(id).classList.remove('has-error'));
    });

    function renderResults(cars) {
      const rc = document.getElementById('resultCount');
      const rn = document.getElementById('resultNum');
      rc.style.display = 'flex';
      rn.textContent = cars.length;

      if (!cars.length) {
        resultsGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">🔍</div>
          <h3>No Matches Found</h3>
          <p>Try adjusting your filters or increasing your budget.</p>
        </div>`;
        return;
      }

      resultsGrid.innerHTML = cars.map((car, i) => `
        <div class="car-card" onclick="openModal(${car.id})" style="animation-delay:${i * 0.07}s">
          <div class="car-img-wrap">
            <img src="${car.image}" alt="${car.name}" class="car-img" loading="lazy"
              onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400'">
            <div class="car-type-badge">${car.bodyType}</div>
            <div class="car-price-badge">${formatPrice(car.price)}</div>
          </div>
          <div class="car-info">
            <div class="car-brand">${car.brand}</div>
            <div class="car-name">${car.name}</div>
            <div class="car-specs">
              <span class="spec-tag">⛽ ${car.fuelType}</span>
              <span class="spec-tag">🪑 ${car.seating} Seats</span>
              <span class="spec-tag">💨 ${car.power}</span>
            </div>
            <button class="btn btn-outline" onclick="event.stopPropagation(); openModal(${car.id})">
              VIEW DETAILS →
            </button>
          </div>
        </div>
      `).join('');
    }

    function openModal(id) {
      const car = carsData.find(c => c.id === id);
      if (!car) return;

      document.getElementById('modalImg').src = car.image;
      document.getElementById('modalImg').alt = car.name;
      document.getElementById('modalTitle').textContent = car.name;
      document.getElementById('modalBrand').textContent = car.brand + ' · ' + formatPrice(car.price);
      document.getElementById('modalDesc').textContent = car.description;

      document.getElementById('specsGrid').innerHTML = [
        ['Engine', car.engine],
        ['Power', car.power],
        ['Torque', car.torque],
        ['Fuel', car.fuelType],
        ['Mileage', car.mileage],
        ['Seating', car.seating + ' Seats'],
        ['Transmission', car.transmission],
        ['Safety', car.safety],
        ['Price', formatPrice(car.price)],
      ].map(([l, v]) => `
        <div class="spec-box">
          <div class="s-label">${l}</div>
          <div class="s-value">${v}</div>
        </div>
      `).join('');

      document.getElementById('featuresList').innerHTML =
        car.features.map(f => `<span class="feature-tag">${f}</span>`).join('');

      document.getElementById('modalOverlay').classList.add('open');
    }

    document.getElementById('modalClose').onclick = () =>
      document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    // Show all cars initially
    renderResults(carsData);
    document.getElementById('resultCount').style.display = 'flex';
    document.getElementById('resultNum').textContent = carsData.length;
  </script>
</body>
</html>
