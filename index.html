<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoNexus — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--primary);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-brand .brand-name {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 6px;
      display: block;
    }

    .login-brand .brand-tagline {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .login-card h2 {
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 1.8rem;
      text-transform: uppercase;
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.5rem;
    }

    .demo-hint {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(232,180,0,0.06);
      border: 1px solid rgba(232,180,0,0.15);
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .demo-hint strong {
      color: var(--accent);
      font-family: 'Exo 2', sans-serif;
    }

    .login-bg-decor {
      position: fixed;
      font-family: 'Orbitron', monospace;
      font-size: 20vw;
      font-weight: 900;
      color: rgba(232,180,0,0.02);
      letter-spacing: -1rem;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    /* Road animation */
    .road-lines {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      pointer-events: none;
      overflow: hidden;
    }

    .road-line {
      position: absolute;
      bottom: 20px;
      width: 60px;
      height: 4px;
      background: var(--accent);
      opacity: 0.3;
      border-radius: 2px;
      animation: roadMove 1.5s linear infinite;
    }

    @keyframes roadMove {
      from { transform: translateX(110vw); }
      to { transform: translateX(-120px); }
    }
  </style>
</head>
<body>
  <div class="login-bg-decor">AUTO</div>

  <div class="road-lines">
    <div class="road-line" style="animation-delay:0s; bottom:30px;"></div>
    <div class="road-line" style="animation-delay:0.5s; bottom:16px;"></div>
    <div class="road-line" style="animation-delay:1s; bottom:30px;"></div>
    <div class="road-line" style="animation-delay:1.3s; bottom:16px;"></div>
  </div>

  <div class="login-container">
    <div class="login-brand">
      <span class="brand-name">AUTONEXUS</span>
      <div class="brand-tagline">Car Suggestions & Analysis</div>
    </div>

    <div class="login-card">
      <h2>Access Portal</h2>
      <form id="loginForm" novalidate>
        <div class="form-group" id="fg-username">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
          <span class="error-msg" id="err-username">Please enter your username.</span>
        </div>

        <div class="form-group" id="fg-password">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <span class="error-msg" id="err-password">Please enter your password.</span>
        </div>

        <button type="submit" class="btn btn-primary login-btn">
          AUTHENTICATE
        </button>
      </form>

      <div class="demo-hint">
        <strong>Demo Credentials</strong><br>
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>1234</strong>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Check if already logged in
    if (sessionStorage.getItem('autonexus_auth') === 'true') {
      window.location.href = 'home.html';
    }

    const form = document.getElementById('loginForm');
    const toast = document.getElementById('toast');

    function showToast(msg, type = 'error') {
      toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
      toast.className = `toast ${type}`;
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function setError(fieldId, msg) {
      const fg = document.getElementById('fg-' + fieldId);
      const err = document.getElementById('err-' + fieldId);
      fg.classList.add('has-error');
      err.textContent = msg;
    }

    function clearError(fieldId) {
      document.getElementById('fg-' + fieldId).classList.remove('has-error');
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      clearError('username'); clearError('password');

      if (!username) {
        setError('username', 'Username is required.');
        valid = false;
      }
      if (!password) {
        setError('password', 'Password is required.');
        valid = false;
      }

      if (!valid) return;

      // Validate credentials
      if (username === 'admin' && password === '1234') {
        sessionStorage.setItem('autonexus_auth', 'true');
        showToast('Login successful! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'home.html', 1200);
      } else {
        showToast('Invalid username or password.', 'error');
        setError('password', 'Incorrect username or password.');
      }
    });
  </script>
</body>
</html>
